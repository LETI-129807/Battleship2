# 111591 - Manuel Pereira
name: Checkstyle Gate 111591
on: [pull_request]

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Checkstyle via Maven
        run: mvn checkstyle:check -Dcheckstyle.config.location=checkstyle-111591.xml -Dcheckstyle.failOnViolation=true
