# 111591 - Manuel Pereira
name: Checkstyle Gate 111591
on: [pull_request]

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkstyle
        uses: dbelyaev/action-checkstyle@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: checkstyle-111591.xml
          level: error # Falha o workflow se houver erro
